name: Android (TWA)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      versionName:
        description: 'appVersionName to build (e.g. 1.2.0)'
        required: false

jobs:
  bubblewrap:
    name: Build AAB and APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache the Bubblewrap toolchain
        # Bubblewrap downloads its own Android SDK on first run; without this
        # every build re-fetches several hundred megabytes.
        uses: actions/cache@v4
        with:
          path: ~/.bubblewrap
          key: bubblewrap-${{ runner.os }}-v1

      - name: Install Bubblewrap
        run: npm install --global @bubblewrap/cli

      - name: Confirm Digital Asset Links are live
        # Building against a domain whose asset links are missing produces an
        # app that opens with a URL bar. Fail here instead.
        run: |
          set -euo pipefail
          curl -fsS "${{ secrets.PRODUCTION_URL }}/.well-known/assetlinks.json" > assetlinks.json
          node -e "
            const statements = require('./assetlinks.json');
            const target = statements?.[0]?.target ?? {};
            if (target.package_name !== '${{ secrets.ANDROID_PACKAGE_NAME }}') {
              throw new Error('assetlinks package_name does not match the build package');
            }
            if (!(target.sha256_cert_fingerprints ?? []).length) {
              throw new Error('assetlinks.json carries no certificate fingerprints');
            }
          "

      - name: Restore the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo 'ANDROID_KEYSTORE_BASE64 is not set'; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > android/kayzen.keystore

      - name: Initialise the TWA project
        run: |
          bubblewrap init \
            --manifest="${{ secrets.PRODUCTION_URL }}/manifest.json" \
            --directory=android/twa \
            --skipPwaValidation
        env:
          # Answers Bubblewrap's interactive prompts from twa-manifest.json.
          BUBBLEWRAP_CI: 'true'

      - name: Apply the committed TWA configuration
        # `bubblewrap init` writes its own manifest from the web app; the
        # committed one is the source of truth for package id, colours and
        # shortcuts, so it wins.
        run: |
          set -euo pipefail
          node -e "
            const fs = require('fs');
            const committed = JSON.parse(fs.readFileSync('android/twa-manifest.json', 'utf8'));
            const version = '${{ github.event.inputs.versionName }}' || '${{ github.ref_name }}'.replace(/^v/, '');
            if (version) {
              committed.appVersionName = version;
              committed.appVersionCode = Number(process.env.GITHUB_RUN_NUMBER);
            }
            committed.signingKey = { path: '../kayzen.keystore', alias: 'kayzen' };
            fs.writeFileSync('android/twa/twa-manifest.json', JSON.stringify(committed, null, 2));
          "
          bubblewrap update --directory=android/twa

      - name: Build
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bubblewrap build --directory=android/twa --skipPwaValidation

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kayzen-android
          retention-days: 30
          path: |
            android/twa/app-release-bundle.aab
            android/twa/app-release-signed.apk

      - name: Remove the keystore from the runner
        if: always()
        run: rm -f android/kayzen.keystore
